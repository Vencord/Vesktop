name: Rust

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Voice stack: opus2 links the system libopus and cpal's ALSA backend
      # needs alsa-lib headers (docs/VOICE.md).
      - run: sudo apt-get update && sudo apt-get install -y libopus-dev libpulse-dev libpipewire-0.3-dev clang
      - run: cargo check --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets
