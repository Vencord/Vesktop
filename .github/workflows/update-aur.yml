name: Update AUR package

on:
    release:
        types:
            - published
    workflow_dispatch:

jobs:
    update:
        runs-on: ubuntu-latest
        container: archlinux:latest
        env:
            HOME: /root
        steps:
            - name: Install packaging tools
              run: |
                  pacman -Syu --noconfirm --needed base-devel devtools git openssh sudo

                  useradd --create-home builder
                  printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
                  chmod 0440 /etc/sudoers.d/builder

            - name: Configure AUR SSH key
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  install -d -m 0700 ~/.ssh
                  printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
                  chmod 0600 ~/.ssh/aur
                  cat > ~/.ssh/config <<'EOF'
                  Host aur.archlinux.org
                      User aur
                      IdentityFile /root/.ssh/aur
                      UserKnownHostsFile /root/.ssh/known_hosts
                      StrictHostKeyChecking yes
                      IdentitiesOnly yes
                  EOF
                  chmod 0600 ~/.ssh/config

            - name: Trust AUR host
              run: |
                  install -m 0600 /dev/null ~/.ssh/known_hosts
                  ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
                  ssh-keygen -F aur.archlinux.org -f ~/.ssh/known_hosts

            - name: Upgrade package and regenerate metadata
              run: |
                  git clone ssh://aur@aur.archlinux.org/vesktop-bin.git aur
                  cd aur
                  pkgctl version upgrade
                  makepkg --printsrcinfo > .SRCINFO

            - name: Build package
              run: |
                  chown -R builder:builder aur
                  cd aur
                  sudo -u builder makepkg --syncdeps --noconfirm

            - name: Push package update
              run: |
                  cd aur
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add PKGBUILD .SRCINFO
                  if git diff --cached --quiet; then
                      echo "AUR package is already up to date"
                      exit 0
                  fi

                  if [[ "${{ github.event_name }}" = workflow_dispatch ]]; then
                      echo "Skipping push for workflow dispatch"
                      exit 0
                  fi

                  git commit -m "Update vesktop-bin to ${{ github.event.release.tag_name }}"
                  git push
